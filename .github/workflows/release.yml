# Pushing a tag like v1.2.0 builds the desktop and Android apps and attaches
# them to a GitHub release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - working-directory: app
        run: |
          flutter build linux --release
          tar -C build/linux/x64/release -czf nightfall-linux-x64.tar.gz --transform 's,^bundle,nightfall,' bundle
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: app/nightfall-linux-x64.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nightfall-windows-x64.zip
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: app/nightfall-windows-x64.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk nightfall-android-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk nightfall-android-arm32.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android
          path: app/nightfall-android-*.apk

  publish:
    needs: [linux, windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nightfall-linux-x64.tar.gz
            nightfall-windows-x64.zip
            nightfall-android-arm64.apk
            nightfall-android-arm32.apk
