# Checks every pull request: the simulation (incl. parity with the original
# TypeScript game, on the VM, JS and Wasm), the Flutter app and a web build.
name: CI

on:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/nightfall_sim
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test
      # the simulation must give identical results compiled to JS and Wasm
      - run: dart test -p node test/cross_platform_test.dart
      - run: dart test -p node -c dart2wasm test/cross_platform_test.dart

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Linux toolchain (the audio plugin builds native code for tests)
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build web --release --wasm
