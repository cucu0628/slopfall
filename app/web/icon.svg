<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nightfall Survivors app icon: full-bleed square (iOS / Android mask it themselves). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2160"/>
      <stop offset="0.55" stop-color="#15123a"/>
      <stop offset="1" stop-color="#0b0d17"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.6" cy="0.38" r="0.42">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#8a5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#ffc94a"/>
    </linearGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98bff"/>
      <stop offset="1" stop-color="#7a45e0"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="306" cy="196" r="128" fill="#fff"/>
      <circle cx="366" cy="150" r="112" fill="#000"/>
    </mask>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <rect width="512" height="512" fill="url(#halo)"/>

  <!-- stars -->
  <g fill="#e6e9f5">
    <circle cx="112" cy="104" r="5" opacity="0.9"/>
    <circle cx="176" cy="66" r="3" opacity="0.6"/>
    <circle cx="420" cy="292" r="4" opacity="0.7"/>
    <circle cx="96" cy="210" r="3" opacity="0.5"/>
    <circle cx="430" cy="86" r="3" opacity="0.5"/>
  </g>

  <!-- crescent moon -->
  <rect width="512" height="512" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- graveyard horizon -->
  <path d="M0 430 Q128 404 256 418 T512 410 V512 H0 Z" fill="#0a0b15"/>
  <g fill="#0a0b15">
    <path d="M92 432 v-34 a18 18 0 0 1 36 0 v34 z"/>
    <path d="M392 428 v-26 a14 14 0 0 1 28 0 v26 z"/>
    <rect x="340" y="384" width="7" height="40"/>
    <rect x="327" y="396" width="33" height="7"/>
  </g>

  <!-- bat, styled after the in-game one -->
  <g transform="translate(232 306)">
    <path fill="url(#bat)" stroke="#2a1458" stroke-width="6" stroke-linejoin="round"
      d="M0 -14
         C-30 -58 -92 -76 -146 -58
         C-122 -44 -114 -22 -118 -2
         C-100 -16 -78 -12 -66 4
         C-54 -10 -32 -6 -24 14
         Q0 30 24 14
         C32 -6 54 -10 66 4
         C78 -12 100 -16 118 -2
         C114 -22 122 -44 146 -58
         C92 -76 30 -58 0 -14 Z"/>
    <path fill="url(#bat)" stroke="#2a1458" stroke-width="6" d="M-20 -52 L-32 -82 L-6 -60 Z M20 -52 L32 -82 L6 -60 Z"/>
    <circle r="44" cy="-14" fill="url(#bat)" stroke="#2a1458" stroke-width="6"/>
    <circle cx="-16" cy="-20" r="9" fill="#ff2b4a"/>
    <circle cx="16" cy="-20" r="9" fill="#ff2b4a"/>
    <circle cx="-13" cy="-23" r="3" fill="#ffd1d8"/>
    <circle cx="19" cy="-23" r="3" fill="#ffd1d8"/>
    <path d="M-10 6 l4 10 l4 -10 M6 6 l4 10 l4 -10" fill="#fff" opacity="0.9"/>
  </g>
</svg>
