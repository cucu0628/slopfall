    <path fill="url(#bat)" stroke="#2a1458" stroke-width="8" d="M-20 -52 L-32 -82 L-6 -60 Z M20 -52 L32 -82 L6 -60 Z"/>
    <circle r="44" cy="-14" fill="url(#bat)" stroke="#2a1458" stroke-width="8"/>
    <circle cx="-16" cy="-20" r="9" fill="#ff2b4a"/>
