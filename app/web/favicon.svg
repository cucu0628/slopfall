<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nightfall Survivors favicon: the app icon simplified for 16-48 px (bigger moon and bat, no scenery). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2160"/>
      <stop offset="0.55" stop-color="#15123a"/>
      <stop offset="1" stop-color="#0b0d17"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.6" cy="0.38" r="0.42">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#8a5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8a5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#ffc94a"/>
    </linearGradient>
    <linearGradient id="bat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98bff"/>
      <stop offset="1" stop-color="#7a45e0"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="300" cy="200" r="168" fill="#fff"/>
      <circle cx="380" cy="140" r="146" fill="#000"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
